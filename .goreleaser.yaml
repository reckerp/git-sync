version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

universal_binaries:
  - replace: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  prerelease: auto

brews:
  - name: git-sync
    repository:
      owner: reckerp
      name: homebrew-tap
    homepage: https://github.com/reckerp/git-sync
    description: Declare your git repositories in TOML and keep them cloned and up to date.
    commit_author:
      name: reckerp
      email: git@recker.io
    dependencies:
      - name: git
    install: |
      bin.install "git-sync"
    # Enables `brew services start git-sync` to run the background daemon.
    service: |
      run [opt_bin/"git-sync", "daemon"]
      environment_variables PATH: std_service_path_env
      keep_alive true
      log_path var/"log/git-sync.log"
      error_log_path var/"log/git-sync.log"
    test: |
      system "#{bin}/git-sync", "--version"
